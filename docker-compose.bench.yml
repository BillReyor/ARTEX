# ARTEX Tencent TSec Benchmark evaluation image - local one-click build + run.
# It has no influence on the production docker-compose.yml (multi-service: artex+postgres).
# Usage:
# cp bench/.env.example bench/.env # Fill in LLM_API_KEY / BENCHMARK_TOKEN etc.
# docker compose -f docker-compose.bench.yml up --build # Build and run in the foreground (see the log)
# docker compose -f docker-compose.bench.yml up --build -d #Backend
#   docker compose -f docker-compose.bench.yml logs -f
# docker compose -f docker-compose.bench.yml down # Stop (add -v to delete the data volume together)
# Browser: http://localhost:8787 (log in with ADMIN_PASSWORD)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Sharing the network with the physical machine: The container directly uses the host network stack and can directly connect to the target network on the host/VPN.
    # In host mode, there is no need for ports mapping. The container is directly bound to the host port: 8787 (UI/API), 8788 (agent),
    # And internal PostgreSQL 5432 - please ensure that these three ports of the host are free (stop the services occupying them before testing locally).
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
